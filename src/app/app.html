<div class="min-h-screen flex flex-col md:flex-row bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 transition-colors">
  
  <!-- Desktop Sidebar (Hidden on mobile) -->
  <app-sidebar></app-sidebar>

  <!-- Main Content Column -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top Header -->
    <app-header (openQuickAdd)="showGlobalQuickAdd.set(true)"></app-header>

    <!-- Page Body Viewport (pb-24 on mobile so content clears the fixed bottom nav) -->
    <main class="flex-1 p-4 sm:p-6 md:p-8 max-w-6xl w-full mx-auto pb-24 md:pb-12">
      <router-outlet></router-outlet>
    </main>

    <!-- Mobile Bottom Navigation (Hidden on desktop) -->
    <app-bottom-nav></app-bottom-nav>
  </div>

  <!-- Global Toast Notifications Host -->
  <app-toast-container></app-toast-container>

  <!-- Global Quick Add Modal -->
  <app-modal
    [isOpen]="showGlobalQuickAdd()"
    title="Quick Add Reminder"
    (close)="showGlobalQuickAdd.set(false)"
  >
    <form [formGroup]="quickAddForm" (ngSubmit)="onSubmitQuickReminder()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Reminder Title *
        </label>
        <input
          type="text"
          formControlName="title"
          placeholder="e.g. Call accountant, buy groceries"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
          Description
        </label>
        <textarea
          formControlName="description"
          rows="2"
          placeholder="Optional notes or details..."
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Date (AD) *
          </label>
          <input
            type="date"
            formControlName="dateAD"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Time *
          </label>
          <input
            type="time"
            formControlName="time"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Priority
          </label>
          <select
            formControlName="priority"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Category
          </label>
          <select
            formControlName="category"
            class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="General">General</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Health">Health</option>
            <option value="Finance">Finance</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100 dark:border-slate-800">
        <app-button
          variant="ghost"
          size="sm"
          type="button"
          (clicked)="showGlobalQuickAdd.set(false)"
        >
          Cancel
        </app-button>
        <app-button
          variant="primary"
          size="sm"
          type="submit"
          [disabled]="quickAddForm.invalid"
        >
          Save Reminder
        </app-button>
      </div>
    </form>
  </app-modal>
</div>
