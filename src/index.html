<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>REMINDER</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Personal Reminder Progressive Web App with Dual Calendar and Offline Support">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REMINDER">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <!-- Google Identity Services client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Immediate Theme Initializer to eliminate Flash of Unstyled Content (FOUC) -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('reminder_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark) || (savedTheme === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <app-root></app-root>
</body>
</html>
